name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse without publishing (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Full release-candidate suite
        run: |
          make -j2
          make test-release-local
          make test-sanitize

  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, platform: linux-x86_64}
          - {runner: macos-15, platform: macos-arm64}
          - {runner: macos-15-intel, platform: macos-x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = push ]; then version="${GITHUB_REF_NAME#v}"; else version="${{ inputs.version }}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and packaging smoke
        run: |
          make -j2
          make test-packaging
      - name: Stage and test archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          test "$(./markup --version | sed -E 's/^Markup\+\+ ([^ ]+)$/\1/')" = "$version"
          root="markup-$version-${{ matrix.platform }}"
          mkdir "$root"; cp markup README.md LICENSE "$root/"; tar -czf "$root.tar.gz" "$root"
          mkdir archive-check; tar -xzf "$root.tar.gz" -C archive-check
          test "$("archive-check/$root/markup" --version)" = "Markup++ $version"
          printf '# Release smoke\n' | "archive-check/$root/markup" --format md - | grep -q '<h1>Release smoke</h1>'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "${{ matrix.platform }}", path: "markup-*.tar.gz"}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = push ]; then version="${GITHUB_REF_NAME#v}"; else version="${{ inputs.version }}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build, stage and test archive
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -j2 LDFLAGS='-static -static-libgcc -static-libstdc++'
          version="${{ steps.version.outputs.version }}"
          test "$(./markup.exe --version | sed -E 's/^Markup\+\+ ([^ ]+)$/\1/')" = "$version"
          if objdump -p markup.exe | sed -n 's/.*DLL Name: //p' | grep -Eiq '^(libgcc|libstdc\+\+|libwinpthread)'; then echo 'runtime DLL dependency' >&2; exit 1; fi
          root="markup-$version-windows-x86_64"; mkdir "$root"; cp markup.exe README.md LICENSE "$root/"
          powershell.exe -NoProfile -Command "Compress-Archive -Path '$root' -DestinationPath '$root.zip'"
          mkdir archive-check; powershell.exe -NoProfile -Command "Expand-Archive -Path '$root.zip' -DestinationPath 'archive-check'"
          test "$("archive-check/$root/markup.exe" --version)" = "Markup++ $version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: windows-x86_64, path: "markup-*.zip"}

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test and verify public scripts
        shell: bash
        run: |
          set -euo pipefail
          make -j2; make test-packaging
          for script in install download update uninstall; do
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://nift-dev.github.io/markup-website/$script" -o "/tmp/$script.sh"
            cmp "packaging/$script.sh" "/tmp/$script.sh"; sh -n "/tmp/$script.sh"
          done

  publish:
    if: github.event_name == 'push'
    needs: [validation, unix, windows, scripts]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.ref }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {path: dist, merge-multiple: true}
      - name: Validate and publish immutable release
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected="markup-$version-linux-x86_64.tar.gz markup-$version-macos-arm64.tar.gz markup-$version-macos-x86_64.tar.gz markup-$version-windows-x86_64.zip"
          for asset in $expected; do test -f "dist/$asset" || { echo "missing $asset" >&2; exit 1; }; done
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')"; expected_sorted="$(printf '%s\n' $expected | sort | tr '\n' ' ')"
          test "$actual" = "$expected_sorted" || { echo "unexpected assets: $actual" >&2; exit 1; }
          (cd dist && sha256sum markup-* | sort > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo 'release exists; refusing modification' >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Markup++ $version" --generate-notes

  rehearse:
    if: github.event_name == 'workflow_dispatch'
    needs: [validation, unix, windows, scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {path: dist, merge-multiple: true}
      - name: Validate rehearsal bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          expected="markup-$version-linux-x86_64.tar.gz markup-$version-macos-arm64.tar.gz markup-$version-macos-x86_64.tar.gz markup-$version-windows-x86_64.zip"
          for asset in $expected; do test -f "dist/$asset"; done
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')"; expected_sorted="$(printf '%s\n' $expected | sort | tr '\n' ' ')"
          test "$actual" = "$expected_sorted"; (cd dist && sha256sum markup-* | sort > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "rehearsal-${{ inputs.version }}", path: "dist/*"}

  installer-public-smoke:
    if: github.event_name == 'push'
    needs: publish
    strategy:
      matrix: {runner: [ubuntu-latest, macos-15, macos-15-intel]}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install tagged release through public installer
        shell: bash
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL https://nift-dev.github.io/markup-website/install -o /tmp/markup-install.sh
          cmp packaging/install.sh /tmp/markup-install.sh
          version="${GITHUB_REF_NAME#v}"; MARKUP_VERSION="$version" MARKUP_INSTALL_DIR="$RUNNER_TEMP/markup-bin" sh /tmp/markup-install.sh
          test "$("$RUNNER_TEMP/markup-bin/markup" --version)" = "Markup++ $version"
