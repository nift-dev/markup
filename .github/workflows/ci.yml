name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          make
          make test
          make test-commonmark-cm9
          make test-commonmark-cm6
          make test-commonmark-cm7
          make test-performance
          make test-packaging
      - name: Sanitizers
        if: runner.os == 'Linux'
        env:
          CC: gcc
          CXX: g++
        run: make test-sanitize

  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  libfuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and run bounded fuzz campaign
        env:
          CC: clang
          CXX: clang++
        run: |
          make fuzz-libfuzzer
          .build/markup-libfuzzer -runs=10000 tests/fuzz-seeds
